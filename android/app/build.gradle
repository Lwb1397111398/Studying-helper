plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.kapt'
}

// 版本号 = git 提交数：本机与 CI 对同一提交算出同一个号，每推一次自动 +1
// 注意：providers.exec 的闭包里不能直接引用 rootDir（会被解析到 exec 配置对象上），先取局部变量
def androidRoot = rootDir.absolutePath
def commitCount
try {
    commitCount = providers.exec {
        commandLine 'git', '-C', androidRoot, 'rev-list', '--count', 'HEAD'
    }.standardOutput.asText.get().trim().toInteger()
} catch (Exception ignored) {
    logger.warn "android: 无法统计 git 提交数（${ignored.class.simpleName}: ${ignored.message}），versionCode 回退为 1"
    commitCount = 1
}

android {
    namespace 'com.studyinghelper.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.studyinghelper.mobile'
        minSdk 26
        targetSdk 35
        versionCode commitCount
        versionName "1.0.${commitCount}"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        // 统一签名：debug 与 release 用同一把仓库内钥匙，任何环境构建的包可互相覆盖安装
        appUpdate {
            storeFile rootProject.file('keystore/app.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.appUpdate
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.appUpdate
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.13'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
