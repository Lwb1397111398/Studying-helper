name: build-release

# 每次推送到默认分支自动构建 Release APK 并覆盖更新 latest Release；
# App 端检查更新只看 latest 这一个入口。
on:
  push:
    branches:
      - codex/stability-convergence
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本号 = git 提交数，必须全量历史
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME="1.0.${VERSION_CODE}"
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          {
            echo "<!-- appupdate versionCode=${VERSION_CODE} versionName=${VERSION_NAME} -->"
            echo ""
            echo "### 更新内容"
            git log -5 --pretty=format:'- %s'
          } > notes.md
          if gh release view latest -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload latest "$APK" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit latest --notes-file notes.md --latest -R "$GITHUB_REPOSITORY"
          else
            gh release create latest "$APK" --notes-file notes.md \
              --title "Studying Helper ${VERSION_NAME}" -R "$GITHUB_REPOSITORY"
          fi
          echo "Published ${VERSION_NAME} (versionCode=${VERSION_CODE})"
